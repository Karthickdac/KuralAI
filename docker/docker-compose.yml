version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: kuralai-postgres
    environment:
      POSTGRES_DB: kuralai
      POSTGRES_USER: kuralai_user
      POSTGRES_PASSWORD: kuralai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuralai_user -d kuralai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KuralAI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kuralai-backend
    env_file: ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kuralai
      DB_USER: kuralai_user
      DB_PASSWORD: kuralai_pass
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped

  # ── Ngrok (for local Twilio webhook testing) ───────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: kuralai-ngrok
    command: http backend:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    profiles:
      - dev  # Only start with: docker compose --profile dev up

volumes:
  postgres_data:
