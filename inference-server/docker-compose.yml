version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kuralai-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  inference:
    build: .
    container_name: kuralai-inference
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: "http://ollama:11434"
      STT_MODEL: "large-v3"
      STT_DEVICE: "cuda"
      STT_COMPUTE_TYPE: "float16"
      LLM_MODEL: "qwen2.5:7b-instruct"
      TTS_DEVICE: "cuda"
      KURALAI_INFERENCE_TOKEN: "${KURALAI_INFERENCE_TOKEN:-}"
    volumes:
      - ./voices:/app/voices
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8800:8800"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
  hf-cache:
