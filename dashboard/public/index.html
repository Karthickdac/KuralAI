<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3C3489" />
    <meta name="description" content="KuralAI Dashboard - Tamil AI Voice Calling by Automystic" />
    <title>KuralAI Dashboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #2C2C2A; }
      #root { min-height: 100vh; }
      .spinner { display: flex; align-items: center; justify-content: center; height: 100vh; }
      .spinner::after { content: ''; width: 36px; height: 36px; border: 3px solid #EEEDFE; border-top-color: #3C3489; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="spinner"></div></div>
  </body>
</html>
